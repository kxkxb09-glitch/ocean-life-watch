<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발견 제보 | 부산SEA로그</title><link rel="stylesheet" href="css/style.css?v=countfix3"><style>.report-form{overflow:hidden}.report-form .two{display:grid;grid-template-columns:minmax(0,1fr) 88px!important;gap:10px;max-width:100%;width:100%}.report-form .two>*{min-width:0}.report-form .two input,.report-form .two select{width:100%!important;min-width:0!important}</style></head><body><main class="app"><header class="topbar"><a class="logo" href="index.html"><span>◒</span><b>부산SEA로그</b></a><a class="close" href="index.html">닫기 ×</a></header><section class="page-intro"><p class="kicker">NEW SIGHTING</p><h1>생물을 발견했나요?<br><em>사진으로 알려주세요.</em></h1><p>기기 안에서 작동하는 AI가 사진을 분석해 생물 종류와 특징을 알려드려요.</p></section><form id="sightingForm" class="report-form"><label id="uploadZone" class="upload"><input id="photo" type="file" accept="image/*" capture="environment" hidden><span class="camera">⌾</span><b>사진 촬영 또는 업로드</b><small>생물의 특징이 잘 보이도록 가까이 찍어주세요</small></label><img id="preview" class="preview" hidden alt="업로드 사진 미리보기"><section id="aiPanel" class="ai-panel" hidden><div class="ai-head"><span>✦</span><div><b>기기 내 AI 해양생물 분석</b><small id="aiStatus">첫 분석 시 모델을 내려받습니다.</small></div><button id="analyzeBtn" type="button">다시 분석</button></div><div id="aiResult" hidden></div></section><input id="detectedAnimal" name="animal" type="hidden"><div class="two"><label>발견 지역<select name="place"><option>해운대</option><option>광안리</option><option>송정</option><option>다대포</option><option>기장</option></select></label><label>개체 수<input name="count" type="number" min="1" value="1"></label></div><label>관찰 메모 <textarea name="note" placeholder="크기, 색, 행동 등을 적어주세요 (선택)"></textarea></label><button class="primary submit" type="submit">AI 분석 결과로 제보하기 <span>→</span></button></form></main><nav><a href="index.html"><span>⌖</span>지도</a><a class="active report-nav" href="report.html"><span>＋</span>발견 제보</a><a href="ai.html"><span>◈</span>도감</a></nav><div class="toast" id="toast"></div><script src="js/browser-ai.js?v=20260805"></script><script src="js/common.js"></script><script src="js/report.js?v=20260805"></script></body></html>
