<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해양생물 제보 | 부산SEA로그</title>
  <link rel="stylesheet" href="css/style.css?v=countstack">
  <style>
    .report-form{overflow:hidden}
    .report-form label{min-width:0}
    .report-form input,.report-form select,.report-form textarea{width:100%;min-width:0;box-sizing:border-box}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">⌁</span><span>부산SEA로그</span></a>
    <nav><a href="index.html#map">생물 지도</a><a href="ai.html">생물 도감</a><a class="active" href="report.html">제보하기</a></nav>
  </header>

  <main class="report-page">
    <section class="page-intro">
      <p class="eyebrow">BUSAN SEA LOG</p>
      <h1>해양생물 제보하기</h1>
      <p>사진을 올리면 기기 내 AI가 생물을 추정하고, 제보를 지도에 기록합니다.</p>
    </section>

    <section class="report-layout">
      <form id="reportForm" class="report-form">
        <div class="upload-box">
          <input id="photo" name="photo" type="file" accept="image/*" capture="environment" required>
          <label for="photo" class="upload-label"><span class="upload-icon">＋</span><strong>사진 촬영 또는 업로드</strong><small>휴대폰에서는 카메라를 바로 열 수 있어요</small></label>
          <img id="preview" alt="업로드한 사진 미리보기" hidden>
        </div>

        <section id="analysisPanel" class="analysis-panel" hidden aria-live="polite">
          <div class="analysis-head"><span class="sparkle">✦</span><div><strong>기기 내 AI 해양생물 분석</strong><p id="analysisStatus">사진을 분석하고 있어요.</p></div><button id="reanalyze" type="button">다시 분석</button></div>
          <div id="analysisResult" class="analysis-result"></div>
        </section>

        <input id="detectedAnimal" name="animal" type="hidden">

        <label>발견 지역
          <select id="location" name="location" required>
            <option value="해운대">해운대</option><option value="송정">송정</option><option value="광안리">광안리</option><option value="다대포">다대포</option><option value="일광">일광</option><option value="기장">기장</option><option value="기타">기타</option>
          </select>
        </label>

        <label>개체 수
          <input id="count" name="count" type="number" min="1" value="1" required>
        </label>

        <label>관찰 메모
          <textarea id="memo" name="memo" rows="4" placeholder="크기, 색, 행동 등을 적어주세요 (선택)"></textarea>
        </label>
        <button class="primary-btn" type="submit">제보 등록하기</button>
      </form>

      <aside class="report-guide">
        <p class="eyebrow">SAFE REPORT</p>
        <h2>안전하게 관찰해요</h2>
        <ul><li>위험생물은 만지거나 가까이 가지 마세요.</li><li>사진은 가능한 멀리서 촬영하세요.</li><li>AI 결과는 참고용이며, 정확한 종 판별은 전문가 확인이 필요합니다.</li></ul>
      </aside>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="js/browser-ai.js?v=20260805"></script>
  <script src="js/common.js"></script>
  <script src="js/report.js?v=20260805"></script>
</body>
</html>
